<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sacrament Meeting Assignment Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --paper:#e5f3fb;
    --paper-line:#9cc8df;
    --ink:#133748;
    --ink-soft:#385d78;
    --teal:#133748;
    --teal-deep:#0f2c3d;
    --accent:#66c0cc;
    --card:#f5fbff;
    --error:#a2453a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Roboto','Helvetica Neue',Arial,sans-serif;
    padding:40px 24px 72px;
    line-height:1.6;
  }
  .wrap{
    max-width:1100px;
    margin:0 auto;
  }
  header.page-head{
    text-align:center;
    margin-bottom:36px;
  }
  .eyebrow{
    font-family:'Courier New',monospace;
    letter-spacing:.18em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--accent);
    margin-bottom:8px;
  }
  h1{
    font-size:38px;
    margin:0 0 10px;
    font-weight:700;
    color:var(--teal-deep);
  }
  .sub{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:14px;
    color:var(--ink-soft);
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:38px;
    align-items:start;
  }
  @media (max-width:820px){
    .grid{grid-template-columns:1fr;}
    .slip-outer{position:static !important;}
  }
  .panel{
    background:var(--card);
    border:1px solid var(--accent);
    border-radius:10px;
    padding:32px 30px 36px;
  }
  .panel h2{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--teal-deep);
    margin:0 0 18px;
    padding-bottom:10px;
    border-bottom:1px solid var(--paper-line);
  }
  label{
    display:block;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:14px;
    color:var(--ink-soft);
    margin:20px 0 8px;
  }
  label.first{margin-top:0;}
  input[type=text], input[type=date], textarea, select{
    width:100%;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:16px;
    color:var(--ink);
    background:#FEFDFB;
    border:1px solid var(--paper-line);
    border-radius:4px;
    padding:12px 14px;
    resize:vertical;
    box-sizing:border-box;
  }
  input:focus, textarea:focus, select:focus{
    outline:none;
    border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(102,192,204,0.1);
  }
  textarea{min-height:74px;line-height:1.5;font-family:'Helvetica Neue',Arial,sans-serif;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .hint{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11px;
    color:#9A927F;
    margin-top:4px;
  }

  /* Preview slip */
  .slip-outer{position:sticky; top:20px;}
  .slip{
    background:var(--card);
    border:1px solid var(--accent);
    padding:40px 36px;
    position:relative;
    box-shadow:0 10px 30px rgba(19,55,72,0.12);
    border-radius:8px;
  }
  .slip:before{
    content:"";
    position:absolute;
    left:0;right:0;top:0;
    height:5px;
    background:linear-gradient(90deg,var(--teal) 0 50%, var(--accent) 50% 100%);
    border-radius:8px 8px 0 0;
  }
  .slip-greeting{
    font-size:22px;
    margin:0 0 20px;
    color:var(--ink);
  }
  .slip-greeting .name{color:var(--teal-deep); font-weight:600;}
  .slip-body p{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:16px;
    line-height:1.85;
    color:var(--ink);
    margin:0 0 18px;
  }
  .fact{
    display:flex;
    gap:12px;
    align-items:flex-start;
    margin:14px 0;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:15px;
  }
  .fact .icon{width:20px;text-align:center;flex-shrink:0;}
  .fact .label{color:var(--ink-soft); min-width:110px;}
  .fact .val{font-weight:600; color:var(--teal-deep);}
  .divider{
    border:none;
    border-top:1px dashed var(--paper-line);
    margin:20px 0;
  }
  .scriptures{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:15px;
    line-height:1.8;
    padding-left:20px;
    margin:8px 0 0;
    list-style:none;
  }
  .scriptures li{
    margin-bottom:6px;
  }
  .scriptures li:before{
    content:"•  ";
    color:var(--teal-deep);
    font-weight:600;
    margin-right:4px;
  }
  .resources{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:15px;
    line-height:1.85;
    color:var(--teal-deep);
    padding-left:20px;
    word-break:break-word;
    margin:8px 0 0;
  }
  .resources li{
    margin-bottom:8px;
  }
  .sign-off{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:16px;
    margin-top:26px;
    color:var(--ink);
  }
  .sign-off .org{
    display:block;
    margin-top:10px;
    font-weight:700;
    color:var(--teal-deep);
  }

  .actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:24px;
  }
  button{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:140px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:.02em;
    padding:12px 16px;
    border-radius:5px;
    border:1px solid var(--teal-deep);
    cursor:pointer;
    background:var(--teal-deep);
    color:#fff;
    flex:1;
    min-height:44px;
    transition:all 0.2s ease;
  }
  button.secondary{
    background:var(--accent);
    color:var(--teal-deep);
    border-color:var(--teal-deep);
  }
  button:hover{
    opacity:.88;
    transform:translateY(-1px);
    box-shadow:0 4px 12px rgba(19,55,72,0.15);
  }
  button:active{
    transform:translateY(0);
  }
  .status{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    color:var(--teal);
    margin-top:8px;
    min-height:18px;
    text-align:center;
    font-weight:500;
  }
  .back-link{
    display:inline-block;
    margin-top:18px;
    color:#fff;
    background:var(--teal-deep);
    padding:10px 18px;
    border-radius:999px;
    text-decoration:none;
    border:1px solid var(--teal-deep);
    transition:all .2s ease;
  }
  .back-link:hover{
    background:var(--accent);
    color:var(--teal-deep);
  }
  .slip-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(19,55,72,0.92);
    z-index:999;
    padding:24px;
    overflow:auto;
  }
  .slip-overlay.visible{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .overlay-content{
    max-width:1200px;
    width:100%;
    max-height:90vh;
    overflow:auto;
  }
  .overlay-toolbar{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-bottom:18px;
  }
  .slip-fullscreen{
    background:var(--card);
    border:1px solid var(--accent);
    box-shadow:0 15px 40px rgba(0,0,0,0.25);
    padding:34px 30px;
    border-radius:8px;
  }
  @page {
    size: auto;
    margin: 8mm;
  }
  @media print {
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
    }
    body * { visibility:hidden !important; }
    .slip, .slip * { visibility: visible !important; }
    .slip {
      position: static !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      box-shadow: none !important;
      border: none !important;
      overflow: visible !important;
      page-break-inside: avoid !important;
      page-break-after: avoid !important;
      line-height: 1.75 !important;
      font-size: 14px !important;
    }
    .slip:before { display: none !important; }
    .slip * {
      color: #000 !important;
    }
    .slip .slip-greeting {
      font-size: 22px !important;
      margin-bottom: 16px !important;
    }
    .slip .slip-body p,
    .slip .resources,
    .slip .scriptures,
    .slip .sign-off,
    .slip .fact {
      font-size: 14px !important;
      line-height: 1.6 !important;
    }
    .slip .fact {
      margin: 12px 0 !important;
    }
    .slip .divider {
      margin: 16px 0 !important;
    }
    .slip ul, .slip ol {
      page-break-inside: avoid !important;
    }
    .slip p, .slip li, .slip .fact, .slip .sign-off {
      orphans: 2;
      widows: 2;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <div class="eyebrow">Ward Bulletin · Assignment Slip</div>
    <h1>Sacrament Meeting Assignment Generator</h1>
    <div class="sub">Fill in the details on the left — the assignment notice updates on the right. Copy or download when ready.</div>
    <a class="back-link" href="../index.html">← Back to Home</a>
  </header>

  <div class="grid">
    <!-- FORM -->
    <div class="panel">
      <h2>Assignment Details</h2>

      <label class="first">Recipient's name</label>
      <input type="text" id="name" value="Sister Endurance Akpan Oyama">

      <div class="row2">
        <div>
          <label>Meeting date</label>
          <input type="date" id="date" value="2026-06-28">
        </div>
        <div>
          <label>Time allotted</label>
          <input type="text" id="time" value="7–10 minutes">
        </div>
      </div>

      <label>Assignment</label>
      <input type="text" id="assignment" value="Give a Talk">

      <label>Order / role (optional)</label>
      <input type="text" id="order" value="Second Speaker">

      <label>Topic</label>
      <input type="text" id="topic" value="Enduring to the End">

      <label>Scriptures to consider (one per line)</label>
      <textarea id="scriptures">2 Nephi 31:20
Matthew 24:13
Doctrine and Covenants 14:7
Mosiah 5:15</textarea>

      <label>Context paragraph</label>
      <textarea id="context">This topic aims to strengthen our resolve to remain faithful to Jesus Christ throughout our lives, persevere through challenges, and continue keeping our covenants.</textarea>

      <label>Study resources (one per line — label | url, or just a note)</label>
      <textarea id="resources">Gospel Topics study guide | https://www.churchofjesuschrist.org/study/manual/gospel-topics/endure-to-the-end-study-guide?lang=eng
"The Strength to Endure," General Conference 2013 | https://www.churchofjesuschrist.org/study/general-conference/2013/10/the-strength-to-endure?lang=eng
Also feel free to reference any other materials relating to the topic in the Gospel Library.</textarea>

      <label>Signed by</label>
      <input type="text" id="signoff" value="The Bishopric">
    </div>

    <!-- PREVIEW -->
    <div class="slip-outer">
      <div class="slip" id="slip">
        <!-- filled by JS -->
      </div>
      <div class="actions">
        <button id="copyBtn">Copy</button>
        <button id="downloadBtn" class="secondary">Download TXT</button>
        <button id="downloadPdfBtn" class="secondary">Download PDF</button>
        <button id="printBtn" class="secondary">Print</button>
        <button id="fullscreenBtn" class="secondary">View</button>
      </div>
      <div class="status" id="status"></div>
    </div>
    <div class="slip-overlay" id="slipOverlay" aria-hidden="true">
      <div class="overlay-content">
        <div class="overlay-toolbar">
          <button id="closeOverlay" class="secondary">✕ Close</button>
        </div>
        <div class="slip slip-fullscreen" id="slipFullscreen"></div>
      </div>
    </div>
  </div>
</div>

<script>
function esc(s){
  const d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}

function formatDate(iso){
  if(!iso) return '';
  try {
    const [y,m,d] = iso.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    const weekday = dt.toLocaleDateString('en-US', { weekday: 'long' });
    const month = dt.toLocaleDateString('en-US', { month: 'long' });
    const day = dt.getDate();
    const suffix = (day % 10 === 1 && day !== 11) ? 'st'
                 : (day % 10 === 2 && day !== 12) ? 'nd'
                 : (day % 10 === 3 && day !== 13) ? 'rd' : 'th';
    return `${weekday}, ${month} ${day}${suffix}, ${y}`;
  } catch(e) {
    return '';
  }
}

function parseLines(id){
  return document.getElementById(id).value
    .split('\n')
    .map(s => s.trim())
    .filter(Boolean);
}

function buildPlainText(){
  const name = document.getElementById('name').value.trim();
  const dateStr = formatDate(document.getElementById('date').value);
  const time = document.getElementById('time').value.trim();
  const assignment = document.getElementById('assignment').value.trim();
  const order = document.getElementById('order').value.trim();
  const topic = document.getElementById('topic').value.trim();
  const scriptures = parseLines('scriptures');
  const context = document.getElementById('context').value.trim();
  const resources = parseLines('resources');
  const signoff = document.getElementById('signoff').value.trim();

  let assignmentLine = `*Assignment:* *${assignment}*`;
  if(order) assignmentLine += ` (*${order}*)`;

  const lines = [];
  lines.push(`Dear ${name},`);
  lines.push('');
  lines.push(`You have been assigned to participate in our upcoming Sacrament Meeting. Please find the details of your assignment below:`);
  lines.push('');
  lines.push(`📅 *Date:* ${dateStr}`);
  lines.push('');
  lines.push(`🗒 ${assignmentLine}`);
  lines.push('');
  lines.push(`⏰ *Time Allotted:* *${time}*`);
  lines.push('');
  if(topic){
    lines.push(`🎙 *Topic:* "${topic}"`);
    lines.push('');
  }
  if(scriptures.length){
    lines.push('Scriptures to consider:');
    scriptures.forEach(s => lines.push(`  • ${s}`));
    lines.push('');
  }
  if(context){
    lines.push(context);
    lines.push('');
  }
  lines.push(`We kindly invite you to prayerfully prepare for this opportunity to uplift and inspire yourself and the ward members. Please arrive early and sit on the stand before the meeting begins.`);
  lines.push('');
  lines.push(`May the Lord bless you as you serve faithfully. 🙏`);
  lines.push('');
  
  if(resources.length){
    lines.push('');
    lines.push('*Study resources:*');
    lines.push('');
    resources.forEach((r,i) => {
      if(r.includes('|')){
        const [label, url] = r.split('|').map(x => x.trim());
        lines.push(`${i+1}. ${label}`);
        lines.push(`   ${url}`);
      } else {
        lines.push(`${i+1}. ${r}`);
      }
    });
  }
  
  lines.push('');
  if(signoff){
    lines.push(`– ${signoff}`);
  }
  return lines.join('\n');
}

function render(){
  const name = document.getElementById('name').value.trim() || '—';
  const dateStr = formatDate(document.getElementById('date').value) || '—';
  const time = document.getElementById('time').value.trim() || '—';
  const assignment = document.getElementById('assignment').value.trim() || '—';
  const order = document.getElementById('order').value.trim();
  const topic = document.getElementById('topic').value.trim();
  const scriptures = parseLines('scriptures');
  const context = document.getElementById('context').value.trim();
  const resources = parseLines('resources');
  const signoff = document.getElementById('signoff').value.trim();

  let html = '';
  html += `<p class="slip-greeting">Dear <span class="name">${esc(name)}</span>,</p>`;
  html += `<div class="slip-body"><p>You have been assigned to participate in our upcoming Sacrament Meeting. Please find the details of your assignment below:</p></div>`;

  html += `<div class="fact"><span class="icon">📅</span><span class="label">Date</span><span class="val">${esc(dateStr)}</span></div>`;
  html += `<div class="fact"><span class="icon">🗒</span><span class="label">Assignment</span><span class="val">${esc(assignment)}${order ? ' (' + esc(order) + ')' : ''}</span></div>`;
  html += `<div class="fact"><span class="icon">⏰</span><span class="label">Time allotted</span><span class="val">${esc(time)}</span></div>`;
  
  if(topic){
    html += `<div class="fact"><span class="icon">🎙</span><span class="label">Topic</span><span class="val">"${esc(topic)}"</span></div>`;
  }

  if(scriptures.length){
    html += `<hr class="divider">`;
    html += `<div class="slip-body"><p style="margin-bottom:4px;"><strong>Scriptures to consider:</strong></p></div>`;
    html += `<ul class="scriptures">` + scriptures.map(s => `<li>${esc(s)}</li>`).join('') + `</ul>`;
  }

  if(context){
    html += `<div class="slip-body" style="margin-top:16px;"><p>${esc(context)}</p></div>`;
  }

  html += `<div class="slip-body"><p>We kindly invite you to prayerfully prepare for this opportunity to uplift and inspire yourself and the ward members. Please arrive early and sit on the stand before the meeting begins.</p></div>`;

  if(resources.length){
    html += `<hr class="divider">`;
    html += `<div class="slip-body"><p style="margin-bottom:4px;"><strong>Study resources:</strong></p></div>`;
    html += `<ol class="resources">` + resources.map(r => {
      if(r.includes('|')){
        const [label, url] = r.split('|').map(x => x.trim());
        return `<li><strong>${esc(label)}</strong><br><small>${esc(url)}</small></li>`;
      }
      return `<li>${esc(r)}</li>`;
    }).join('') + `</ol>`;
  }

  if(signoff){
    html += `<div class="sign-off">With love and appreciation,<span class="org">– ${esc(signoff)}</span></div>`;
  }

  document.getElementById('slip').innerHTML = html;
}

// Event listeners
document.querySelectorAll('input, textarea').forEach(el => {
  el.addEventListener('input', render);
});

// Copy to clipboard
document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildPlainText();
  const status = document.getElementById('status');
  try{
    await navigator.clipboard.writeText(text);
    status.textContent = '✓ Copied to clipboard';
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    status.textContent = '✓ Copied to clipboard';
  }
  setTimeout(() => status.textContent = '', 2500);
});

// Download as text
document.getElementById('downloadBtn').addEventListener('click', () => {
  try {
    const text = buildPlainText();
    const name = document.getElementById('name').value.trim().replace(/[^a-z0-9]+/gi,'_') || 'assignment';
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `assignment_${name}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    const status = document.getElementById('status');
    status.textContent = '✓ Downloaded TXT file';
    setTimeout(() => status.textContent = '', 2500);
  } catch(e) {
    console.error('Download error:', e);
    document.getElementById('status').textContent = '✗ Download failed';
  }
});

// Download as PDF
document.getElementById('downloadPdfBtn').addEventListener('click', () => {
  try {
    const name = document.getElementById('name').value.trim().replace(/[^a-z0-9]+/gi,'_') || 'assignment';
    const slipElement = document.getElementById('slip');
    const opt = {
      margin: [10, 10, 10, 10],
      filename: `assignment_${name}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, logging: false },
      jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
    };
    html2pdf().set(opt).from(slipElement).save().then(() => {
      const status = document.getElementById('status');
      status.textContent = '✓ PDF downloaded';
      setTimeout(() => status.textContent = '', 2500);
    }).catch((err) => {
      console.error('PDF error:', err);
      document.getElementById('status').textContent = '✗ PDF generation failed';
    });
  } catch(e) {
    console.error('PDF error:', e);
    document.getElementById('status').textContent = '✗ PDF generation failed';
  }
});

// Print
document.getElementById('printBtn').addEventListener('click', () => {
  window.print();
});

// Fullscreen view
document.getElementById('fullscreenBtn').addEventListener('click', () => {
  const overlay = document.getElementById('slipOverlay');
  overlay.classList.add('visible');
  overlay.setAttribute('aria-hidden', 'false');
  document.getElementById('slipFullscreen').innerHTML = document.getElementById('slip').innerHTML;
});

// Close fullscreen
document.getElementById('closeOverlay').addEventListener('click', () => {
  const overlay = document.getElementById('slipOverlay');
  overlay.classList.remove('visible');
  overlay.setAttribute('aria-hidden', 'true');
});

// Close on escape key
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    const overlay = document.getElementById('slipOverlay');
    if(overlay.classList.contains('visible')){
      overlay.classList.remove('visible');
      overlay.setAttribute('aria-hidden', 'true');
    }
  }
});

// Initial render
render();
</script>
</body>
</html>
