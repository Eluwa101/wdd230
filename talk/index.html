<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sacrament Meeting Assignment Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<!-- jsPDF (text-based PDF generation) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper:#e5f3fb;
    --paper-line:#9cc8df;
    --ink:#133748;
    --ink-soft:#385d78;
    --teal:#133748;
    --teal-deep:#0f2c3d;
    --accent:#66c0cc;
    --card:#f5fbff;
    --error:#a2453a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Roboto','Helvetica Neue',Arial,sans-serif;
    padding:40px 24px 72px;
    line-height:1.6;
  }
  .wrap{
    max-width:1100px;
    margin:0 auto;
  }
  header.page-head{
    text-align:center;
    margin-bottom:36px;
  }
  .eyebrow{
    font-family:'Courier New',monospace;
    letter-spacing:.18em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--accent);
    margin-bottom:8px;
  }
  h1{
    font-size:38px;
    margin:0 0 10px;
    font-weight:700;
    color:var(--teal-deep);
  }
  .sub{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:14px;
    color:var(--ink-soft);
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:38px;
    align-items:start;
  }
  @media (max-width:820px){
    .grid{grid-template-columns:1fr;}
    .slip-outer{position:static !important;}
  }
  .panel{
    background:var(--card);
    border:1px solid var(--accent);
    border-radius:10px;
    padding:32px 30px 36px;
  }
  .panel h2{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--teal-deep);
    margin:0 0 18px;
    padding-bottom:10px;
    border-bottom:1px solid var(--paper-line);
  }
  label{
    display:block;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:14px;
    color:var(--ink-soft);
    margin:20px 0 8px;
  }
  label.first{margin-top:0;}
  input[type=text], input[type=date], textarea, select{
    width:100%;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:16px;
    color:var(--ink);
    background:#FEFDFB;
    border:1px solid var(--paper-line);
    border-radius:4px;
    padding:12px 14px;
    resize:vertical;
    box-sizing:border-box;
  }
  input:focus, textarea:focus, select:focus{
    outline:none;
    border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(102,192,204,0.1);
  }
  textarea{min-height:74px;line-height:1.5;font-family:'Helvetica Neue',Arial,sans-serif;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .hint{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11px;
    color:#9A927F;
    margin-top:4px;
  }

  /* Preview slip */
  .slip-outer{position:sticky; top:20px;}
  .slip{
    background:var(--card);
    border:1px solid var(--accent);
    padding:40px 36px;
    position:relative;
    box-shadow:0 10px 30px rgba(19,55,72,0.12);
    border-radius:8px;
  }
  .slip:before{
    content:"";
    position:absolute;
    left:0;right:0;top:0;
    height:5px;
    background:linear-gradient(90deg,var(--teal) 0 50%, var(--accent) 50% 100%);
    border-radius:8px 8px 0 0;
  }
  .slip-greeting{
    font-size:22px;
    margin:0 0 20px;
    color:var(--ink);
  }
  .slip-greeting .name{color:var(--teal-deep); font-weight:600;}
  .slip-body p{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:16px;
    line-height:1.85;
    color:var(--ink);
    margin:0 0 18px;
  }
  .fact{
    display:flex;
    gap:12px;
    align-items:flex-start;
    margin:14px 0;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:15px;
  }
  .fact .icon{width:20px;text-align:center;flex-shrink:0;}
  .fact .label{color:var(--ink-soft); min-width:110px;}
  .fact .val{font-weight:600; color:var(--teal-deep);}
  .divider{
    border:none;
    border-top:1px dashed var(--paper-line);
    margin:20px 0;
  }
  .scriptures{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:15px;
    line-height:1.8;
    padding-left:20px;
    margin:8px 0 0;
    list-style:none;
  }
  .scriptures li{
    margin-bottom:6px;
  }
  .scriptures li:before{
    content:"•  ";
    color:var(--teal-deep);
    font-weight:600;
    margin-right:4px;
  }
  .resources{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:15px;
    line-height:1.85;
    color:var(--teal-deep);
    padding-left:20px;
    word-break:break-word;
    margin:8px 0 0;
  }
  .resources li{
    margin-bottom:8px;
  }
  .sign-off{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:16px;
    margin-top:26px;
    color:var(--ink);
  }
  .sign-off .org{
    display:block;
    margin-top:10px;
    font-weight:700;
    color:var(--teal-deep);
  }

  .actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:24px;
  }
  button{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:140px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:.02em;
    padding:12px 16px;
    border-radius:5px;
    border:1px solid var(--teal-deep);
    cursor:pointer;
    background:var(--teal-deep);
    color:#fff;
    flex:1;
    min-height:44px;
    transition:all 0.2s ease;
  }
  button.secondary{
    background:var(--accent);
    color:var(--teal-deep);
    border-color:var(--teal-deep);
  }
  button[disabled]{
    opacity:0.6;
    cursor:default;
    transform:none;
    box-shadow:none;
  }
  button:hover{
    opacity:.88;
    transform:translateY(-1px);
    box-shadow:0 4px 12px rgba(19,55,72,0.15);
  }
  button:active{
    transform:translateY(0);
  }
  .status{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    color:var(--teal);
    margin-top:8px;
    min-height:18px;
    text-align:center;
    font-weight:500;
  }
  .back-link{
    display:inline-block;
    margin-top:18px;
    color:#fff;
    background:var(--teal-deep);
    padding:10px 18px;
    border-radius:999px;
    text-decoration:none;
    border:1px solid var(--teal-deep);
    transition:all .2s ease;
  }
  .back-link:hover{
    background:var(--accent);
    color:var(--teal-deep);
  }
  .slip-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(19,55,72,0.92);
    z-index:999;
    padding:24px;
    overflow:auto;
  }
  .slip-overlay.visible{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .overlay-content{
    max-width:1200px;
    width:100%;
    max-height:90vh;
    overflow:auto;
  }
  .overlay-toolbar{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-bottom:18px;
  }
  .slip-fullscreen{
    background:var(--card);
    border:1px solid var(--accent);
    box-shadow:0 15px 40px rgba(0,0,0,0.25);
    padding:34px 30px;
    border-radius:8px;
  }
  /* PDF/print-friendly container (hidden on screen) */
  .output-document{display:none;}
  @media (min-width:0){
    .output-document{display:none !important;}
  }
  @page {
    size: auto;
    margin: 8mm;
  }
  @media print {
    /* hide everything except the output document */
    body > * { display: none !important; }
    #outputDocument { display: block !important; }
    #outputDocument { width: 100%; max-width: 100%; margin: 0; padding: 0; }
    #outputDocument * { color: #000 !important; }
    #outputDocument .slip { box-shadow:none; border:none; padding: 0.5in; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <div class="eyebrow">Ward Bulletin · Assignment Slip</div>
    <h1>Sacrament Meeting Assignment Generator</h1>
    <div class="sub">Fill in the details on the left — the assignment notice updates on the right. Copy or download when ready.</div>
    <a class="back-link" href="../index.html">← Back to Home</a>
  </header>

  <div class="grid">
    <!-- FORM -->
    <div class="panel">
      <h2>Assignment Details</h2>

      <label class="first" for="name">Recipient's name</label>
      <input type="text" id="name" value="Sister Endurance Akpan Oyama">

      <div class="row2">
        <div>
          <label for="date">Meeting date</label>
          <input type="date" id="date" value="2026-06-28">
        </div>
        <div>
          <label for="time">Time allotted</label>
          <input type="text" id="time" value="7–10 minutes">
        </div>
      </div>

      <label for="assignment">Assignment</label>
      <input type="text" id="assignment" value="Give a Talk">

      <label for="order">Order / role (optional)</label>
      <input type="text" id="order" value="Second Speaker">

      <label for="topic">Topic</label>
      <input type="text" id="topic" value="Enduring to the End">

      <label for="scriptures">Scriptures to consider (one per line)</label>
      <textarea id="scriptures">2 Nephi 31:20
Matthew 24:13
Doctrine and Covenants 14:7
Mosiah 5:15</textarea>

      <label for="context">Context paragraph</label>
      <textarea id="context">This topic aims to strengthen our resolve to remain faithful to Jesus Christ throughout our lives, persevere through challenges, and continue keeping our covenants.</textarea>

      <label for="resources">Study resources (one per line — label | url, or just a note)</label>
      <textarea id="resources">Gospel Topics study guide | https://www.churchofjesuschrist.org/study/manual/gospel-topics/endure-to-the-end-study-guide?lang=eng
"The Strength to Endure," General Conference 2013 | https://www.churchofjesuschrist.org/study/general-conference/2013/10/the-strength-to-endure?lang=eng
Also feel free to reference any other materials relating to the topic in the Gospel Library.</textarea>

      <label for="signoff">Signed by</label>
      <input type="text" id="signoff" value="The Bishopric">
    </div>

    <!-- PREVIEW -->
    <div class="slip-outer">
      <div class="slip" id="slip">
        <!-- filled by JS -->
      </div>
      <div class="actions">
        <button id="copyBtn">Copy</button>
        <button id="downloadBtn" class="secondary">Download TXT</button>
        <button id="downloadPdfBtn" class="secondary">Download PDF</button>
        <button id="printBtn" class="secondary">Print</button>
        <button id="fullscreenBtn" class="secondary">View</button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </div>
    <div class="slip-overlay" id="slipOverlay" aria-hidden="true">
      <div class="overlay-content">
        <div class="overlay-toolbar">
          <button id="closeOverlay" class="secondary">✕ Close</button>
        </div>
        <div class="slip slip-fullscreen" id="slipFullscreen" tabindex="-1"></div>
      </div>
    </div>
  </div>
</div>

<!-- Hidden container for producing PDF/Print output from the shared data model -->
<div id="outputDocument" class="output-document" aria-hidden="true"></div>

<script>
function esc(s){
  const d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}

function formatDate(iso){
  if(!iso) return '';
  try {
    const [y,m,d] = iso.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    const weekday = dt.toLocaleDateString('en-US', { weekday: 'long' });
    const month = dt.toLocaleDateString('en-US', { month: 'long' });
    const day = dt.getDate();
    const suffix = (day % 10 === 1 && day !== 11) ? 'st'
                 : (day % 10 === 2 && day !== 12) ? 'nd'
                 : (day % 10 === 3 && day !== 13) ? 'rd' : 'th';
    return `${weekday}, ${month} ${day}${suffix}, ${y}`;
  } catch(e) {
    return '';
  }
}

function parseLines(id){
  return document.getElementById(id).value
    .split('\n')
    .map(s => s.trim())
    .filter(Boolean);
}

// --- Shared data model and validation ---
function getAssignmentData(){
  return {
    name: document.getElementById('name').value.trim(),
    date: document.getElementById('date').value,
    time: document.getElementById('time').value.trim(),
    assignment: document.getElementById('assignment').value.trim(),
    order: document.getElementById('order').value.trim(),
    topic: document.getElementById('topic').value.trim(),
    scriptures: parseLines('scriptures'),
    context: document.getElementById('context').value.trim(),
    resources: parseLines('resources'),
    signoff: document.getElementById('signoff').value.trim()
  };
}

function validateAssignment(data){
  const errors = {};
  if(!data.name) errors.name = 'Recipient name is required.';
  if(!data.date) errors.date = 'Meeting date is required.';
  if(!data.assignment) errors.assignment = 'Assignment is required.';
  if(!data.time) errors.time = 'Time allotted is required.';
  return errors;
}

function showStatus(msg, isError){
  const status = document.getElementById('status');
  status.textContent = msg || '';
  status.style.color = isError ? 'var(--error)' : 'var(--teal)';
}

// --- Formatting helpers ---
function safeSplitResource(line){
  const idx = line.indexOf('|');
  if(idx === -1) return { label: line, url: '' };
  return { label: line.slice(0, idx).trim(), url: line.slice(idx+1).trim() };
}

// Build plain text without Markdown markers, normalized blank lines
function buildPlainText(data){
  const lines = [];
  const dateStr = formatDate(data.date);

  lines.push(`Dear ${data.name || '—'},`);
  lines.push('');
  lines.push('You have been assigned to participate in our upcoming Sacrament Meeting. Please find the details of your assignment below:');
  lines.push('');
  if(dateStr) lines.push(`Date: ${dateStr}`);
  if(data.assignment) {
    let a = `Assignment: ${data.assignment}`;
    if(data.order) a += ` (${data.order})`;
    lines.push(a);
  }
  if(data.time) lines.push(`Time allotted: ${data.time}`);
  if(data.topic) lines.push(`Topic: ${data.topic}`);

  if(data.scriptures && data.scriptures.length){
    lines.push('');
    lines.push('Scriptures to consider:');
    data.scriptures.forEach(s => lines.push(`- ${s}`));
  }

  if(data.context){
    lines.push('');
    lines.push(data.context);
  }

  lines.push('');
  lines.push('We kindly invite you to prayerfully prepare for this opportunity to uplift and inspire yourself and the ward members. Please arrive early and sit on the stand before the meeting begins.');
  lines.push('');
  lines.push('May the Lord bless you as you serve faithfully.');
  lines.push('');

  if(data.resources && data.resources.length){
    lines.push('Study resources:');
    data.resources.forEach((r, i) => {
      const parsed = safeSplitResource(r);
      if(parsed.url) {
        lines.push(`${i+1}. ${parsed.label}`);
        lines.push(`   ${parsed.url}`);
      } else {
        lines.push(`${i+1}. ${parsed.label}`);
      }
    });
    lines.push('');
  }

  if(data.signoff) lines.push(`– ${data.signoff}`);

  // Normalize blank lines: collapse >2 into 2
  const out = [];
  let blankStreak = 0;
  for(const l of lines){
    if(!l.trim()){
      blankStreak++;
      if(blankStreak <= 2) out.push('');
    } else {
      blankStreak = 0;
      out.push(l);
    }
  }
  return out.join('\n');
}

// Message text with emojis/formatting (optional)
function buildMessageText(data){
  const dateStr = formatDate(data.date);
  const lines = [];
  lines.push(`Dear ${data.name || '—'},`);
  lines.push('');
  if(dateStr) lines.push(`📅 Date: ${dateStr}`);
  let a = `🗒 Assignment: ${data.assignment || '—'}`;
  if(data.order) a += ` (${data.order})`;
  lines.push(a);
  if(data.time) lines.push(`⏰ Time allotted: ${data.time}`);
  if(data.topic) lines.push(`🎙 Topic: ${data.topic}`);
  if(data.scriptures && data.scriptures.length){
    lines.push('');
    lines.push('Scriptures to consider:');
    data.scriptures.forEach(s => lines.push(` • ${s}`));
  }
  if(data.context){
    lines.push('');
    lines.push(data.context);
  }
  lines.push('');
  lines.push('May the Lord bless you as you serve faithfully. 🙏');
  if(data.resources && data.resources.length){
    lines.push('');
    lines.push('Study resources:');
    data.resources.forEach((r,i) => {
      const parsed = safeSplitResource(r);
      if(parsed.url) lines.push(`${i+1}. ${parsed.label} — ${parsed.url}`);
      else lines.push(`${i+1}. ${parsed.label}`);
    });
  }
  if(data.signoff) lines.push('');
  if(data.signoff) lines.push(`– ${data.signoff}`);
  return lines.join('\n');
}

function buildSlipHtml(data){
  const dateStr = formatDate(data.date) || '—';
  const name = data.name || '—';
  const time = data.time || '—';
  const assignment = data.assignment || '—';
  const order = data.order || '';
  const topic = data.topic || '';
  const scriptures = data.scriptures || [];
  const context = data.context || '';
  const resources = data.resources || [];
  const signoff = data.signoff || '';

  let html = '';
  html += `<p class="slip-greeting">Dear <span class="name">${esc(name)}</span>,</p>`;
  html += `<div class="slip-body"><p>You have been assigned to participate in our upcoming Sacrament Meeting. Please find the details of your assignment below:</p></div>`;

  html += `<div class="fact"><span class="icon">📅</span><span class="label">Date</span><span class="val">${esc(dateStr)}</span></div>`;
  html += `<div class="fact"><span class="icon">🗒</span><span class="label">Assignment</span><span class="val">${esc(assignment)}${order ? ' (' + esc(order) + ')' : ''}</span></div>`;
  html += `<div class="fact"><span class="icon">⏰</span><span class="label">Time allotted</span><span class="val">${esc(time)}</span></div>`;
  
  if(topic){
    html += `<div class="fact"><span class="icon">🎙</span><span class="label">Topic</span><span class="val">"${esc(topic)}"</span></div>`;
  }

  if(scriptures.length){
    html += `<hr class="divider">`;
    html += `<div class="slip-body"><p style="margin-bottom:4px;"><strong>Scriptures to consider:</strong></p></div>`;
    html += `<ul class="scriptures">` + scriptures.map(s => `<li>${esc(s)}</li>`).join('') + `</ul>`;
  }

  if(context){
    html += `<div class="slip-body" style="margin-top:16px;"><p>${esc(context)}</p></div>`;
  }

  html += `<div class="slip-body"><p>We kindly invite you to prayerfully prepare for this opportunity to uplift and inspire yourself and the ward members. Please arrive early and sit on the stand before the meeting begins.</p></div>`;

  if(resources.length){
    html += `<hr class="divider">`;
    html += `<div class="slip-body"><p style="margin-bottom:4px;"><strong>Study resources:</strong></p></div>`;
    html += `<ol class="resources">` + resources.map(r => {
      const parsed = safeSplitResource(r);
      if(parsed.url){
        return `<li><strong>${esc(parsed.label)}</strong><br><small>${esc(parsed.url)}</small></li>`;
      }
      return `<li>${esc(parsed.label)}</li>`;
    }).join('') + `</ol>`;
  }

  if(signoff){
    html += `<div class="sign-off">With love and appreciation,<span class="org">– ${esc(signoff)}</span></div>`;
  }

  return html;
}

// --- Text-based PDF generation using jsPDF ---
function generatePdfUsingJsPDF(data){
  // Use the jsPDF UMD bundle loaded in head
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const margin = 20; // mm
  const usableWidth = pageWidth - margin * 2;
  let x = margin;
  let y = margin;
  const lineHeight = 7; // mm approximate

  function ensureSpace(needed){
    if(y + needed > pageHeight - margin){
      doc.addPage();
      y = margin;
    }
  }

  // Header / Greeting
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.text(`Dear ${data.name || '—'},`, x, y);
  y += 8;

  // Intro paragraph
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11);
  const intro = 'You have been assigned to participate in our upcoming Sacrament Meeting. Please find the details of your assignment below:';
  const introLines = doc.splitTextToSize(intro, usableWidth);
  ensureSpace(introLines.length * lineHeight);
  doc.text(introLines, x, y);
  y += introLines.length * lineHeight;
  y += 2;

  // Facts
  doc.setFontSize(11);
  function writeFact(label, value){
    if(!value) return;
    ensureSpace(lineHeight);
    doc.setFont('helvetica', 'normal');
    doc.text(label, x, y);
    const labelWidth = 30; // position for values
    doc.setFont('helvetica', 'bold');
    const wrapped = doc.splitTextToSize(value, usableWidth - labelWidth);
    doc.text(wrapped, x + labelWidth, y);
    y += wrapped.length * lineHeight;
  }

  writeFact('Date:', formatDate(data.date) || '—');
  writeFact('Assignment:', data.assignment + (data.order ? ` (${data.order})` : ''));
  writeFact('Time allotted:', data.time || '—');
  if(data.topic) writeFact('Topic:', `"${data.topic}"`);

  // Scriptures
  if(data.scriptures && data.scriptures.length){
    y += 4;
    ensureSpace(lineHeight);
    doc.setFont('helvetica', 'bold');
    doc.text('Scriptures to consider:', x, y);
    y += lineHeight;
    doc.setFont('helvetica', 'normal');
    data.scriptures.forEach(s => {
      ensureSpace(lineHeight);
      const bullet = `• ${s}`;
      const wrapped = doc.splitTextToSize(bullet, usableWidth);
      doc.text(wrapped, x, y);
      y += wrapped.length * lineHeight;
    });
  }

  // Context
  if(data.context){
    y += 4;
    ensureSpace(lineHeight);
    const wrapped = doc.splitTextToSize(data.context, usableWidth);
    doc.text(wrapped, x, y);
    y += wrapped.length * lineHeight;
  }

  // Closing paragraph
  y += 4;
  ensureSpace(lineHeight);
  const closing = 'We kindly invite you to prayerfully prepare for this opportunity to uplift and inspire yourself and the ward members. Please arrive early and sit on the stand before the meeting begins.';
  const closingLines = doc.splitTextToSize(closing, usableWidth);
  doc.text(closingLines, x, y);
  y += closingLines.length * lineHeight;
  y += 2;
  ensureSpace(lineHeight);
  doc.text('May the Lord bless you as you serve faithfully.', x, y);
  y += lineHeight;

  // Resources
  if(data.resources && data.resources.length){
    y += 6;
    ensureSpace(lineHeight);
    doc.setFont('helvetica', 'bold');
    doc.text('Study resources:', x, y);
    y += lineHeight;
    data.resources.forEach((r, i) => {
      ensureSpace(lineHeight);
      const parsed = safeSplitResource(r);
      doc.setFont('helvetica', 'normal');
      const labelWrapped = doc.splitTextToSize(`${i+1}. ${parsed.label}`, usableWidth);
      doc.text(labelWrapped, x, y);
      y += labelWrapped.length * lineHeight;
      if(parsed.url){
        ensureSpace(lineHeight);
        // render url in blue and add link annotation
        doc.setTextColor(0, 0, 200);
        doc.setFont('helvetica', 'normal');
        const urlWrapped = doc.splitTextToSize(parsed.url, usableWidth);
        // place each url line and add link annotation for the first line
        for(let j=0;j<urlWrapped.length;j++){
          const line = urlWrapped[j];
          const py = y;
          doc.text(line, x + 4, py);
          if(j === 0){
            const tw = doc.getTextWidth(line);
            // link expects coords in user units (mm)
            doc.link(x + 4, py - 2, tw, 6, { url: parsed.url });
          }
          y += lineHeight;
          ensureSpace(lineHeight);
        }
        doc.setTextColor(0,0,0);
      }
    });
  }

  // Signoff
  if(data.signoff){
    y += 8;
    ensureSpace(lineHeight);
    doc.setFont('helvetica', 'normal');
    doc.text(`– ${data.signoff}`, x, y);
  }

  return doc;
}

// --- Rendering and event wiring ---
function render(){
  const data = getAssignmentData();
  document.getElementById('slip').innerHTML = buildSlipHtml(data);
}

// Bind inputs to render
document.querySelectorAll('input, textarea').forEach(el => {
  el.addEventListener('input', render);
});

// --- Copy to clipboard (plain text by default) ---
document.getElementById('copyBtn').addEventListener('click', async () => {
  const data = getAssignmentData();
  const errors = validateAssignment(data);
  if(Object.keys(errors).length){
    showStatus(Object.values(errors).join(' '), true);
    return;
  }
  const text = buildPlainText(data);
  const status = document.getElementById('status');
  try{
    await navigator.clipboard.writeText(text);
    showStatus('✓ Copied to clipboard');
  }catch(e){
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showStatus('✓ Copied to clipboard');
  }
  setTimeout(()=> showStatus(''), 2500);
});

// Download as text
document.getElementById('downloadBtn').addEventListener('click', () => {
  const data = getAssignmentData();
  const errors = validateAssignment(data);
  if(Object.keys(errors).length){
    showStatus(Object.values(errors).join(' '), true);
    return;
  }
  try {
    const text = buildPlainText(data);
    const name = data.name.replace(/[^a-z0-9]+/gi,'_') || 'assignment';
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `assignment_${name}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showStatus('✓ Downloaded TXT file');
    setTimeout(()=> showStatus(''), 2500);
  } catch(e) {
    console.error('Download error:', e);
    showStatus('✗ Download failed', true);
  }
});

// Download as PDF (now using jsPDF text API)
document.getElementById('downloadPdfBtn').addEventListener('click', async () => {
  const btn = document.getElementById('downloadPdfBtn');
  const data = getAssignmentData();
  const errors = validateAssignment(data);
  if(Object.keys(errors).length){
    showStatus(Object.values(errors).join(' '), true);
    return;
  }

  try{
    btn.disabled = true;
    showStatus('Preparing PDF...');
    const doc = generatePdfUsingJsPDF(data);
    const name = data.name.replace(/[^a-z0-9]+/gi,'_') || 'assignment';
    doc.save(`assignment_${name}.pdf`);
    showStatus('✓ PDF downloaded');
  }catch(err){
    console.error('PDF error:', err);
    showStatus('✗ PDF generation failed', true);
  }finally{
    btn.disabled = false;
    setTimeout(()=> showStatus(''), 2500);
  }
});

// Print - prepare outputDocument and call print
document.getElementById('printBtn').addEventListener('click', () => {
  const data = getAssignmentData();
  const errors = validateAssignment(data);
  if(Object.keys(errors).length){
    showStatus(Object.values(errors).join(' '), true);
    return;
  }
  const output = document.getElementById('outputDocument');
  output.innerHTML = buildPdfHtml(data);
  // Use print - print stylesheet will show outputDocument only
  window.print();
});

// Fullscreen view
const fullscreenBtn = document.getElementById('fullscreenBtn');
const overlay = document.getElementById('slipOverlay');
const slipFullscreen = document.getElementById('slipFullscreen');
const closeOverlay = document.getElementById('closeOverlay');

fullscreenBtn.addEventListener('click', () => {
  const data = getAssignmentData();
  slipFullscreen.innerHTML = buildSlipHtml(data);
  overlay.classList.add('visible');
  overlay.setAttribute('aria-hidden', 'false');
  // move focus into overlay
  closeOverlay.focus();
});

// Close fullscreen
closeOverlay.addEventListener('click', () => {
  overlay.classList.remove('visible');
  overlay.setAttribute('aria-hidden', 'true');
  fullscreenBtn.focus();
});

// Close on escape key
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    if(overlay.classList.contains('visible')){
      overlay.classList.remove('visible');
      overlay.setAttribute('aria-hidden', 'true');
      fullscreenBtn.focus();
    }
  }
});

// Initial render
render();
</script>
